<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-content">
        <header>
            <div class="app-title"> 
                <div class="logo">
                    <img src="https://static.vecteezy.com/system/resources/previews/080/926/153/non_2x/completion-checkmark-icon-symbolizing-successful-task-accomplishment-or-approved-document-selection-vector.jpg" alt="">
                </div>
                <div class="title">
                    <h1>Task Manager</h1>
                    <p>Stay organized and get things done.</p>
                </div>
            </div>
            <button id="theme-toggle" type="button" aria-label="Toggle theme">
                <span class="theme-option active">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M565-395q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-226.5 56.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>
                </span>
                <span class="theme-option">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
                </span>
            </button>
        </header>

        <section class="task-input">
            <form id="task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?">
                <button id="add-task" type="submit">Add</button>
            </form>
        </section>

        <section class="task-filters">
            <ul class="filters-list">
                <li class="filter active">
                    <button class="filter-button activated" type="button" data-filter="all">All</button>
                </li>
                <li class="filter">
                    <button class="filter-button" type="button" data-filter="active">Active</button>
                </li>
                <li class="filter">
                    <button class="filter-button" type="button" data-filter="completed">Completed</button>
                </li>
            </ul>
        </section>

        <section class="task-section">
            <ul class="task-list">
                <li class="task-item completed">
                    <label>
                        <input type="checkbox" class="task-checkbox" checked>
                        <span class="task-text">Completed task</span>
                    </label>
                    <div class="options">
                        <span class="task-date">14 Sep 2026</span>
                        <button class="edit-task" type="button" aria-label="Edit task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
                        </button>
                        <button class="delete-task" type="button" aria-label="Delete task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                        </button>
                    </div>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" class="task-checkbox">
                        <span class="task-text">Remaning task</span>
                    </label>
                    <div class="options">
                        <span class="task-date">9 Sep 2026</span>
                        <button class="edit-task" type="button" aria-label="Edit task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
                        </button>
                        <button class="delete-task" type="button" aria-label="Delete task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                        </button>
                    </div>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" class="task-checkbox">
                        <span class="task-text">Another remaning task</span>
                    </label>
                    <div class="options">
                        <span class="task-date">1 Aug 2026</span>
                        <button class="edit-task" type="button" aria-label="Edit task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
                        </button>
                        <button class="delete-task" type="button" aria-label="Delete task">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                        </button>
                    </div>
                </li>
            </ul>
        </section>
        
        <section class="summary-section">
            <div class="task-summary">
                <div class="summary-info">
                    <div class="tasks-remaining">2 tasks remaining</div> 
                    <div class="statistics">
                        <span class="total">5 total •</span>
                        <span class="active">2 active •</span>
                        <span class="completed">1 completed</span>
                    </div>
                </div>
                <button id="clear-completed-tasks" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                    <span>Clear completed tasks</span>
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
